name: 'dbt_training'
version: '1.0.0'
config-version: 2

profile: 'dbt_training'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_training:
    staging:
      # Staging: light cleanup of raw data; cheap views
      +materialized: view
      # Day 5 (Medallion): uncomment to build staging into a SILVER schema
      # +schema: silver
    intermediate:
      # Intermediate: reusable logic steps, inlined as CTEs downstream
      +materialized: ephemeral
    marts:
      # Marts: business-ready; tables for query performance
      +materialized: table
      # Day 5 (Medallion): uncomment to build marts into a GOLD schema
      # +schema: gold

seeds:
  dbt_training:
    fx_rates:
      +column_types:
        currency: varchar(3)
        usd_rate: number(10,4)
