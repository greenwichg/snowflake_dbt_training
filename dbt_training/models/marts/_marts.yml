version: 2

models:
  - name: dim_customers
    description: >
      Customer dimension: one row per customer with lifetime order metrics.
      Lifetime values count completed orders only, in USD.
      Has an enforced DATA CONTRACT (Day 4): dbt verifies the model produces
      exactly these columns and types before building it, so downstream
      consumers can rely on the schema not drifting.
    config:
      contract:
        enforced: true
    columns:
      - name: customer_id
        description: Primary key.
        data_type: number
        tests:
          - unique
          - not_null
      - name: first_name
        data_type: varchar
      - name: last_name
        data_type: varchar
      - name: email
        data_type: varchar
      - name: country_code
        data_type: varchar
      - name: signup_date
        data_type: date
      - name: is_active
        data_type: boolean
      - name: lifetime_orders
        data_type: number
      - name: lifetime_value_usd
        description: Sum of completed order amounts in USD.
        # NUMBER with no scale means NUMBER(38,0) - it would silently round!
        data_type: number(12,2)
      - name: first_order_date
        data_type: date
      - name: most_recent_order_date
        data_type: date

  - name: fct_orders
    description: One row per order with customer attributes and order sequencing.
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: amount_usd
        tests:
          - is_positive          # custom generic test (tests/generic/)
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100000

  - name: fct_web_events
    description: Incremental fact of flattened web events, one row per event.
    columns:
      - name: event_id
        tests:
          - unique
          - not_null
